name: PR Coach

on:
  pull_request:
    branches: [main]

jobs:
  coach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install pytest

      # Detect the lesson from branch name
      - name: Detect lesson
        id: lesson
        run: |
          echo "branch=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT

      # Run the appropriate lesson tests
      - name: Run tests
        id: test
        run: |
          if [[ "${{ steps.lesson.outputs.branch }}" == "lesson-1" ]]; then
            pytest tests/test_lesson1.py
          elif [[ "${{ steps.lesson.outputs.branch }}" == "lesson-2" ]]; then
            pytest tests/test_lesson2.py
          fi

      # Comment feedback on PR
      - name: Provide Feedback
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const success = "${{ job.status }}" === "success";

            let message = "";
            if (success) {
              message = `✅ ${branch} complete!\n\n🎉 Great job.\n\n🔓 Next lesson unlocked!\n\nNext steps:\n1. git fetch origin\n2. git checkout lesson-2\n3. Open a PR when ready`;
            } else {
              message = `❌ Not quite there.\n\n💡 Hints:\n- Check return values\n- Make sure function names match exactly\n- Run pytest locally\n\nPush again when ready 💪`;
            }

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: message
            });
