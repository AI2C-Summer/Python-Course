name: PR Coach
on:
  pull_request:
    branches: [main]

# 1. Added permissions required to add labels and post comments
permissions:
  pull-requests: write
  issues: write

jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest

      # 🧠 Detect lesson from branch
      - name: Detect lesson
        id: lesson
        run: |
          BRANCH=${GITHUB_HEAD_REF}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          # 2. Prevent workflow crash if branch has no numbers (grep exits with 1)
          NUM=$(echo $BRANCH | grep -o '[0-9]*' || true)
          echo "number=$NUM" >> $GITHUB_OUTPUT

      # 🚫 Prevent invalid branch names
      - name: Validate branch name
        id: validate # 3. Added ID to check outcome later
        run: |
          if [[ ! "${{ steps.lesson.outputs.branch }}" =~ ^lesson-[0-9]+$ ]]; then
            echo "❌ Branch must be named lesson-X"
            exit 1
          fi

      # 🧪 Run correct test
      - name: Run tests
        run: |
          LESSON=${{ steps.lesson.outputs.number }}
          if [ -f "tests/test_lesson${LESSON}.py" ]; then
            pytest tests/test_lesson${LESSON}.py
          else
            echo "❌ No test found for lesson $LESSON"
            exit 1
          fi

      # 🏷️ Add label on success
      - name: Add completion label
        if: success()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # 4. Explicitly define token
          labels: lesson-${{ steps.lesson.outputs.number }}-complete

      # 💬 Feedback (dynamic + scalable)
      - name: Provide Feedback
        uses: actions/github-script@v7
        # 5. Only run if it's a valid lesson branch, even if tests fail
        if: always() && steps.validate.outcome == 'success'
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const lessonNumber = parseInt(branch.split('-')[1]);
            const nextLesson = lessonNumber + 1;
            const success = "${{ job.status }}" === "success";

            let message = "";
            
            if (success) {
              message = `✅ Lesson ${lessonNumber} complete!

            🎉 Nice work - you're making progress.

            🔓 Lesson ${nextLesson} unlocked!

            Next steps:
            1. git fetch origin
            2. git checkout lesson-${nextLesson}
            3. Open a new PR

            Keep going 🚀`;
            } else {
              message = `❌ Not quite there yet.

            💡 Hints:
            - Are you returning a value?
            - Does your function name match exactly?
            - Try running: pytest locally

            Push updates to this PR when ready 💪`;
            }

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: message
            });
